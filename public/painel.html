<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GestãoSalão — Painel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EDE8;
  --surface:#FFFFFF;
  --surface2:#F7F4F0;
  --border:#E8E2DA;
  --border-s:#D4CBC0;
  --text:#1A1410;
  --text2:#6B5F52;
  --text3:#A89880;

  --green:#1A6B3C;--green-bg:#E8F5EE;--green-br:#A8D8BC;--green-light:#F0FAF4;
  --yellow:#8B6000;--yellow-bg:#FFF8E6;--yellow-br:#E8C840;--yellow-light:#FFFBF0;
  --red:#B02020;--red-bg:#FEF0EE;--red-br:#E8A8A0;--red-light:#FFF5F5;
  --blue:#1A4A8B;--blue-bg:#EEF3FF;--blue-br:#A8C0F0;--blue-light:#F5F8FF;
  --gold:#B5893A;--gold-bg:#FBF4E8;--gold-br:#E8D4A0;
  --magenta:#A81E6B;--magenta-bg:#FDF0F7;--magenta-br:#E8A8CC;

  --r:14px;--rs:8px;--shadow:0 2px 8px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.12);--shadow-lg:0 8px 32px rgba(0,0,0,.16);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}

.app{max-width:960px;margin:0 auto;padding:16px}

/* HEADER — sempre 2 linhas fixas, independente do tamanho do nome/legenda
   do restaurante: linha 1 (logo+nome, truncado com "...") nunca empurra ou
   desalinha a linha 2 (botões de menu). */
.app-header{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;padding:14px 18px;background:var(--text);border-radius:var(--r);box-shadow:var(--shadow-md)}
.app-header-top{display:flex;align-items:center;gap:14px;min-width:0}
.logo-wrap{width:52px;height:52px;border-radius:10px;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.header-info{flex:1;min-width:0}
.header-info h1{font-size:17px;font-weight:800;color:white;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-info p{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header-menu{display:flex;gap:8px}
.menu-hamb{width:40px;height:40px;flex-shrink:0;border-radius:var(--rs);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:white;font-size:19px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:background .15s;-webkit-tap-highlight-color:transparent}
.menu-hamb:hover{background:rgba(255,255,255,.2)}
.menu-hamb:active{background:rgba(255,255,255,.3)}
.menu-acao-rapida{flex:1;padding:10px 8px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:white;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;text-align:center;transition:background .15s;-webkit-tap-highlight-color:transparent}
.menu-acao-rapida:hover{background:rgba(255,255,255,.2)}
.menu-acao-rapida:active{background:rgba(255,255,255,.3)}

/* MENU LATERAL (drawer) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1001;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-backdrop.aberto{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;background:var(--surface);z-index:1002;box-shadow:var(--shadow-lg);transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding:18px}
.drawer.aberto{transform:translateX(0)}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.drawer-hd span{font-size:16px;font-weight:800;color:var(--text)}
.drawer-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--rs);border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);text-align:left;margin-bottom:4px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.drawer-item:active{background:var(--surface2)}
.drawer-item.ativo{background:var(--text);color:white}

/* LIGHTBOX (visualizador em tela cheia da imagem do menu do Evento) */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1100;align-items:center;justify-content:center;overflow:auto}
.lightbox.aberto{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox-close{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:white;font-size:20px;cursor:pointer;z-index:1101;display:flex;align-items:center;justify-content:center}

/* Nível de acesso "consulta": esconde os pontos de edição mais óbvios.
   Isto é só conforto de interface — quem garante de verdade que consulta
   não edita nada é o RLS do banco, não esta regra de CSS. */
body.nivel-consulta .edit-only{display:none!important}

/* Configurações (funcionários/praças/setores/logo): só Master edita.
   Igual acima, é só conforto de interface — o RLS já bloqueia gerencial
   e consulta de escrever nessas tabelas mesmo sem essa regra. */
body.nivel-nao-master .master-only{display:none!important}

/* CONTROLS */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end}
.ctrl label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
select{font-size:13px;padding:9px 28px 9px 12px;border-radius:var(--rs);border:1.5px solid var(--border-s);background:var(--surface) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B5F52' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;-webkit-appearance:none;color:var(--text);font-weight:600;box-shadow:var(--shadow)}

.main{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:620px){.app{padding:12px}.main{grid-template-columns:1fr}.header-info h1{font-size:15px}}
/* DESKTOP — regras aditivas, só entram em telas largas; mobile/tablet abaixo de 1024px continuam lendo exatamente as regras de sempre */
@media(min-width:1024px){.app{max-width:1400px}.main{grid-template-columns:380px 1fr}}

/* CALENDÁRIO */
.cal{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-md);border:1px solid var(--border)}
.cal-nav{display:flex;align-items:center;margin-bottom:14px}
.cal-nav button{width:34px;height:34px;border-radius:var(--rs);border:1.5px solid var(--border-s);background:var(--surface2);color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .15s}
.cal-nav button:hover{background:var(--border);transform:scale(1.05)}
.cal-title{flex:1;text-align:center;font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdh{font-size:9px;font-weight:800;color:var(--text3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cd{border-radius:var(--rs);padding:3px 2px;text-align:center;cursor:pointer;border:1.5px solid transparent;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:1px;-webkit-tap-highlight-color:transparent;transition:all .15s;position:relative}
.cd:active{transform:scale(.92)}
.cd .cn{font-size:13px;font-weight:800}
.cd .cl{font-size:7px;line-height:1.2;padding:0 1px;overflow:hidden;white-space:nowrap;max-width:100%}
.cd .cb{width:75%;height:4px;border-radius:2px;margin-top:auto;margin-bottom:2px}
.cd .cf{height:4px;border-radius:2px}

/* DIAS ESPECIAIS NO CAL */
.cd.dom{color:var(--red)}
.cd.sab{background:var(--yellow-light);border-color:var(--yellow-br)}
.cd.hoje{background:var(--blue-light);border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-br)}
.cd.sel{background:var(--text)!important;border-color:var(--text)!important;box-shadow:var(--shadow-md)}
.cd.fer{background:var(--yellow-bg);border-color:var(--yellow-br)}

.leg{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-top:12px;padding-top:12px;border-top:1.5px solid var(--border)}
.ldot{width:10px;height:4px;border-radius:2px;display:inline-block;margin-right:2px;vertical-align:middle}
.leg-fer{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--text2);margin-top:8px}
.leg-fer span{display:flex;gap:6px;align-items:baseline}
.leg-fer b{color:var(--yellow);font-weight:800;min-width:16px}

/* ESCALA */
.esc{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid var(--border)}
.esc-empty{padding:2.5rem 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;text-align:center;gap:10px}
.esc-empty .ei{font-size:40px;margin-bottom:4px}
.esc-empty p{font-size:14px;color:var(--text2);font-weight:500}
.esc-empty span{font-size:12px;color:var(--text3)}

/* HEADER ESCALA */
.eh{padding:14px 16px;border-bottom:1.5px solid var(--border);background:linear-gradient(135deg,var(--text) 0%,#3A2A1A 100%)}
.edate{font-size:18px;font-weight:800;color:white;letter-spacing:-.3px}
.eturn{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:500}
.head-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

/* MÉTRICAS */
.mrow{display:grid;grid-template-columns:repeat(3,1fr)}
.mc{padding:12px 14px;border-bottom:1.5px solid var(--border)}
.mc:not(:last-child){border-right:1.5px solid var(--border)}
.mc .ml{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mc .mv{font-size:22px;font-weight:900;color:var(--text);line-height:1;margin-top:4px;letter-spacing:-.5px}
.mc .ms{font-size:10px;color:var(--text3);margin-top:2px;font-weight:500}
.mc.red .mv{color:var(--red)}
.mc.green .mv{color:var(--green)}

/* SEÇÕES */
.sec{padding:12px 16px;border-bottom:1.5px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec.bg2{background:var(--surface2)}
.sec-title{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* BADGES */
.bdg{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-block;font-weight:700;border:1.5px solid}
.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.wn{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-br)}
.dn{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.in{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-br)}
.gr{background:var(--surface2);color:var(--text2);border-color:var(--border-s)}
.bl{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-br)}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--blue-light);border:1px solid var(--blue-br);border-radius:20px;padding:4px 10px;margin:2px;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ALERTAS */
.albox{padding:10px 16px;border-bottom:1.5px solid var(--border);font-size:12px;display:flex;align-items:flex-start;gap:10px;line-height:1.5;font-weight:500}
.aldn{background:var(--red-light);color:var(--red);border-left:4px solid var(--red)}
.alwn{background:var(--yellow-light);color:var(--yellow);border-left:4px solid var(--yellow-br)}
.alin{background:var(--blue-light);color:var(--blue);border-left:4px solid var(--blue)}
.alor{background:var(--gold-bg);color:var(--gold);border-left:4px solid var(--gold-br)}
.alev{background:var(--magenta-bg);color:var(--magenta);border-left:4px dashed var(--magenta-br)}

/* FOLGA CARDS */
.folga-cards{display:flex;flex-direction:column;gap:6px}
.folga-card{border-radius:var(--rs);padding:10px 12px;border-left:4px solid}
.folga-card-hd{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.folga-card-hd .fcdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.folga-card-hd span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.folga-nomes{display:flex;flex-wrap:wrap;gap:4px}
.folga-nome{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;border:1.5px solid}

/* CARDS PRAÇAS E SUPORTE */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);padding:12px;box-shadow:var(--shadow);transition:box-shadow .15s;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--green)}
.pc.pp::before{background:var(--gold)}
.pc.px::before{background:var(--red)}
.pc.pf{opacity:.4;border-style:dashed}
.pc.pf::before{display:none}
.pc:hover{box-shadow:var(--shadow-md)}
.pn{font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px}
.ps{font-size:10px;color:var(--text3);margin-bottom:8px;font-weight:500}

/* INPUT RESERVAS */
.rinp{width:72px;font-size:16px;font-weight:800;padding:6px 8px;border-radius:var(--rs);border:2px solid var(--gold-br);background:var(--gold-bg);color:var(--gold);text-align:center;font-family:inherit;box-shadow:var(--shadow)}
.rinp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}

/* EXTRA */
/* max-width+box-sizing prendem o chip na largura do card; o texto (nome +
   função + valor) quebra linha dentro do chip quando não cabe numa linha só
   (min-width:0 é o que permite isso — sem ele o span de texto se recusa a
   encolher). O botão × fica flex-shrink:0, sempre visível na borda direita,
   nunca é empurrado pra fora — era esse o bug: chip virava mais largo que o
   card e cortava o × no lado direito. */
.extra-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--red-bg);border:1.5px solid var(--red-br);border-radius:12px;padding:3px 9px;margin:2px;color:var(--red);font-weight:700;max-width:100%;box-sizing:border-box}
.extra-chip .ect-txt{white-space:normal;word-break:break-word;min-width:0}
.extra-chip button{background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;line-height:1;padding:0;margin-left:2px;flex-shrink:0}
/* Duas linhas (nome em cima; função + valor + botão embaixo) em vez de uma
   pill só — com nome+função+valor+botão espremidos numa linha só, "Função"
   cortava nos cards mais estreitos do .cgrid (minmax(130px,1fr)). */
.extra-input-wrap{display:flex;flex-direction:column;gap:4px;background:var(--red-bg);border:1.5px solid var(--red-br);border-radius:var(--rs);padding:6px 8px;margin:2px 0;width:100%}
.extra-input-wrap input,.extra-input-wrap select{border:none;background:transparent;font-size:12px;color:var(--red);font-family:inherit;font-weight:600;width:100%}
.extra-input-wrap select{font-size:11px}
.extra-input-wrap input:focus,.extra-input-wrap select:focus{outline:none}
.extra-input-wrap input::placeholder{color:var(--red-br);font-weight:400}
.extra-input-wrap .eiw-linha3{display:flex;align-items:center;gap:4px}
.extra-input-wrap .eiw-linha3 input{width:auto;flex:1;min-width:0}
.extra-input-wrap button{background:none;border:none;cursor:pointer;color:var(--red);font-size:18px;font-weight:800;padding:0;flex-shrink:0}

/* BOTÃO AUSÊNCIA */
.btn-ausencia{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--yellow);border:1.5px solid var(--yellow-br);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--yellow-bg);font-family:inherit;font-weight:700;box-shadow:var(--shadow);transition:all .15s}
.btn-ausencia:hover{background:var(--yellow-br);color:white}

/* AUSÊNCIA ITEM */
.aus-item{background:var(--red-light);border:1.5px solid var(--red-br);border-radius:var(--rs);border-left:4px solid var(--red);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.aus-item-nome{font-size:13px;color:var(--red);font-weight:800}
.aus-item-acts{display:flex;gap:6px;flex-shrink:0}
.aus-btn-edit{background:var(--yellow-bg);border:1px solid var(--yellow-br);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--yellow);cursor:pointer;font-weight:700;font-family:inherit}
.aus-btn-rem{background:none;border:none;cursor:pointer;color:var(--red);font-size:20px;line-height:1;padding:0}

/* MODAL */
.mov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:999;backdrop-filter:blur(2px)}
@media(min-width:480px){.mov{align-items:center;padding:16px}}
.mbox{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:22px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
@media(min-width:480px){.mbox{border-radius:var(--r)}}
.mbox h3{font-size:16px;font-weight:800;margin-bottom:4px;color:var(--text)}
.mbox .msub{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.4}
.msel,.minp{width:100%;margin-bottom:10px;font-size:13px;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--border-s);background:var(--surface2);color:var(--text);font-family:inherit;font-weight:500}
.msel:focus,.minp:focus{outline:none;border-color:var(--gold);background:var(--surface)}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.macts button{padding:9px 18px;border-radius:var(--rs);border:1.5px solid var(--border-s);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;transition:all .15s}
.macts button:hover{background:var(--border)}
.macts .bok{background:var(--text);color:white;border-color:var(--text)}
.macts .bok:hover{background:#3A2A1A}
.macts .bwn{background:var(--yellow);color:white;border-color:var(--yellow)}
.macts .bwp{background:#25D366;color:white;border-color:#25D366}
.macts .brd{background:var(--red);color:white;border-color:var(--red)}
.rel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.btn-xlsx{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid #1D6F42;background:#1D6F42;color:white;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);white-space:nowrap;flex-shrink:0}
.btn-xlsx:hover{background:#175935}

/* FOLGAS MODAL */
.fs-setor{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow)}
.fs-setor-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.fs-setor-hd:active{background:var(--border)}
.fs-setor-left{display:flex;align-items:center;gap:10px}
.fs-setor-nm{font-size:14px;font-weight:800;color:var(--text)}
.fs-setor-sub{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}
.fs-setor-body{border-top:1.5px solid var(--border);padding:8px}
.fs-func-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--surface);margin-bottom:6px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);transition:all .15s}
.fs-func-btn:last-child{margin-bottom:0}
.fs-func-btn:active{background:var(--surface2);transform:scale(.98)}
.fs-func-right{display:flex;align-items:center;gap:8px}
.fs-func-count{font-size:12px;color:var(--text3);font-weight:500}
.fs-func-count.has{color:var(--green);font-weight:700}

/* CARDS DE RESUMO DOS RELATÓRIOS */
.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:var(--shadow)}
.stat-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-icon.red{background:var(--red-bg);color:var(--red)}
.stat-icon.blue{background:var(--blue-bg);color:var(--blue)}
.stat-icon.green{background:var(--green-bg);color:var(--green)}
.stat-icon.gold{background:var(--gold-bg);color:var(--gold)}
.stat-num{font-size:26px;font-weight:900;color:var(--text);line-height:1}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* CALENDÁRIO MODAL */
.cal-modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-modal-hd h3{font-size:17px;font-weight:800}
.cal-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border-s);background:var(--surface2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-m-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-m-nav button{padding:6px 14px;border-radius:var(--rs);border:1.5px solid var(--border-s);background:var(--surface2);cursor:pointer;font-size:18px;font-weight:700;box-shadow:var(--shadow)}
.cal-m-title{font-size:15px;font-weight:800}
.cal-m-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-m-dh{font-size:9px;font-weight:800;color:var(--text3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal-m-d{border-radius:var(--rs);min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid transparent;-webkit-tap-highlight-color:transparent;transition:all .15s}
.cal-m-d:active{transform:scale(.88)}
.cal-m-d.sel{background:var(--text);color:white;box-shadow:var(--shadow-md)}
.cal-m-d.dom{color:var(--red)}
.cal-m-d.sab{background:var(--yellow-light);color:var(--yellow)}
.cal-m-d.emp{opacity:0;pointer-events:none}
.cal-resumo{font-size:13px;padding:10px 12px;border-radius:var(--rs);margin-bottom:12px;text-align:center;font-weight:700}
.cal-resumo.has{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-br)}
.cal-resumo.empty{background:var(--surface2);color:var(--text3);font-weight:500}
.btn-cal-ok{width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--text);color:white;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-md)}

/* TABELA AUSÊNCIAS */
.aus-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.aus-table th{background:var(--surface2);padding:9px 10px;text-align:left;font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border)}
.aus-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);font-weight:500}
.aus-table tr:last-child td{border-bottom:none}
.aus-table tr:hover td{background:var(--surface2)}
.aus-empty{text-align:center;padding:28px;color:var(--text3);font-size:13px;font-weight:500}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-row select{flex:1;min-width:120px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:white;border-radius:var(--r);padding:12px 20px;font-size:13px;font-weight:700;z-index:1000;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:90vw}
/* AGENDA */
.ag-hoje{background:var(--blue-bg);border:1.5px solid var(--blue-br);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

.ag-btn{padding:6px 12px;border-radius:20px;border:1.5px solid;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.ag-day-label{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 4px;margin-top:4px}
.ag-empty{text-align:center;padding:32px 16px;color:var(--text3);font-size:13px}

// Persistência no Supabase (gravação otimista: a UI já foi atualizada em memória

async function persistirFolgaVendida(nome,ds,vendida,tipo,valor){
  const funcionarioId=FUNC_ID_POR_NOME[nome];
  if(!funcionarioId)return;
  if(vendida){
    const{error}=await supabaseClient.from("folgas_vendidas").insert({funcionario_id:funcionarioId,data:ds,tipo,valor:valor||null});
    if(error)avisoErro("Não foi possível salvar a venda de folga.");
  }else{
    const{error}=await supabaseClient.from("folgas_vendidas").delete().eq("funcionario_id",funcionarioId).eq("data",ds);
    if(error)avisoErro("Não foi possível desfazer a venda de folga.");
  }
}

async function persistirFolgasFuncionario(nome,mi,ano,dias){
  const funcionarioId=FUNC_ID_POR_NOME[nome];
  if(!funcionarioId)return;
  const ultimoDia=new Date(ano,mi+1,0).getDate();
  const inicio=`${ano}-${String(mi+1).padStart(2,"0")}-01`;
  const fim=`${ano}-${String(mi+1).padStart(2,"0")}-${String(ultimoDia).padStart(2,"0")}`;
  const{error:delError}=await supabaseClient.from("folgas").delete().eq("funcionario_id",funcionarioId).gte("data",inicio).lte("data",fim);
  if(delError){avisoErro("Não foi possível atualizar as folgas de "+nome+".");return;}
  if(dias.length>0){
    const linhas=dias.map(d=>({funcionario_id:funcionarioId,data:`${ano}-${String(mi+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}));
    const{error:insError}=await supabaseClient.from("folgas").insert(linhas);
    if(insError)avisoErro("Não foi possível atualizar as folgas de "+nome+".");
  }
}

const sanitizarNomeArquivo=s=>(s||"").trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"-");
// Nome de Tabela do Excel só aceita letras/números/underscore e não pode
// começar com dígito — prefixo fixo garante isso sem precisar checar.
const sanitizarNomeTabela=s=>"Tbl_"+(s||"Dados").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9_]/g,"_").slice(0,200);
// Gera e baixa um .xlsx com uma Tabela do Excel de verdade (cabeçalho em
// negrito, AutoFilter e faixas de cor já vêm de fábrica com addTable) — usado
// por todos os botões "Exportar Excel" dos relatórios. resumoLinhas (opcional)
// vira linhas soltas em negrito ANTES da tabela (mesmo resumo que já aparece
// no topo da tela). ExcelJS vem via CDN, mesmo padrão do supabase-js — se por
// algum motivo não tiver carregado (offline, CDN fora do ar), avisa em vez de
// quebrar.
async function exportarPlanilha(nomeArquivo,nomeAba,resumoLinhas,colunas,linhasDados){
  if(typeof ExcelJS==="undefined"){avisoErro("Não foi possível carregar o gerador de Excel. Verifique sua conexão e tente de novo.");return;}
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet((nomeAba||"Planilha").slice(0,31));
  (resumoLinhas||[]).forEach(l=>{
    const row=ws.addRow(l);
    row.getCell(1).font={bold:true};
  });
  if(resumoLinhas&&resumoLinhas.length)ws.addRow([]);
  const linhaCabecalho=ws.rowCount+1;
  ws.addTable({
    name:sanitizarNomeTabela(nomeAba),
    ref:`A${linhaCabecalho}`,
    headerRow:true,
    style:{theme:"TableStyleMedium9",showRowStripes:true},
    columns:colunas.map(c=>({name:c,filterButton:true})),
    rows:linhasDados,
  });
  colunas.forEach((c,i)=>{
    const maior=linhasDados.reduce((m,r)=>Math.max(m,String(r[i]??"").length),c.length);
    ws.getColumn(i+1).width=Math.min(Math.max(maior+2,10),40);
  });
  const buffer=await wb.xlsx.writeBuffer();
  const blob=new Blob([buffer],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  if(fer)return CAA;

function distribuicaoAutomatica(dg){
  const dist={};
  PD.forEach(p=>{dist[p.id]=[];});
  const al=new Set();
  PD.filter(p=>!p.fch).forEach(p=>{(p.gc||[]).forEach(g=>{if(dg.includes(g)&&!al.has(g)){dist[p.id].push(g);al.add(g);}});});
  // Restante (sem praça preferida): round-robin entre as praças elegíveis,
  // pra não empilhar todo mundo na primeira praça da lista (bug antigo).
  const pracasElegiveis=PD.filter(p=>!p.fch&&!p.fimSemana);
  if(pracasElegiveis.length>0){
    let i=0;
    dg.forEach(g=>{
      if(al.has(g))return;
      const p=pracasElegiveis[i%pracasElegiveis.length];
      dist[p.id].push(g);al.add(g);i++;
    });
  }
  return dist;
}

let _distTemp={};
function getDistBase(d,mi){
  const dg=EQ.garcons.m.filter(g=>disponivelParaEscala(g,d,mi));
  return distribuicaoAutomatica(dg);
}
function removerDaPraca(pid,nome,d,mi,tu=gt()){
  const escManual=getEscalaManual(d,mi,tu);
  const dist=escManual?JSON.parse(JSON.stringify(escManual)):getDistBase(d,mi);
  if(dist[pid]) dist[pid]=dist[pid].filter(n=>n!==nome);
  setEscalaManual(d,mi,dist,tu);
  renderModalEscala(d,mi,dist);
  scrollParaPracaEditada(window._pracaEditSel);
}
function moverParaPraca(pid,nome,d,mi,tu=gt()){
  if(!nome) return;
  const escManual=getEscalaManual(d,mi,tu);
  const dist=escManual?JSON.parse(JSON.stringify(escManual)):getDistBase(d,mi);
  Object.keys(dist).forEach(k=>{dist[k]=dist[k].filter(n=>n!==nome);});
  if(!dist[pid]) dist[pid]=[];
  dist[pid].push(nome);
  setEscalaManual(d,mi,dist,tu);
  renderModalEscala(d,mi,dist);
  scrollParaPracaEditada(window._pracaEditSel);
}
function salvarEscalaManual(d,mi){
  cMod();renderEsc(d,mi);
  showToast("✅ Escala do dia atualizada!");
}

function renderEmpty(){
  const hoje=agHoje();
  // Agenda é agenda, Evento é evento: o widget da Home não mostra Eventos
  // (ficam só na aba "🎉 Eventos"), mas inclui tarefas permanentes (sem data).
  const naoEvento=c=>c.tipo!=="evento";
  const nHoje=AGENDA.filter(c=>naoEvento(c)&&!c.concluido&&(agEhPermanente(c)||c.data===hoje)).length;
  // mostrar só próxima ocorrência de cada série recorrente
  const hoje2=agHoje();
  const gruposVistos2={};
  const listaFull=AGENDA.filter(c=>naoEvento(c)&&!c.concluido&&(agEhPermanente(c)||c.data>=hoje2)).sort((a,b)=>{
    if(!a.data&&!b.data)return 0;
    if(!a.data)return -1;
    if(!b.data)return 1;
    return a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora);
  });
  const lista=[];
  listaFull.forEach(c=>{
    if(!c.grupoId){lista.push(c);return;}
    if(!gruposVistos2[c.grupoId]){gruposVistos2[c.grupoId]=true;lista.push(c);}
  });
  const listaSlice=lista.slice(0,5);

  let itensH="";
  if(listaSlice.length===0){
    itensH=`<div style="text-align:center;padding:20px 0;color:var(--text3);font-size:13px">Nenhum compromisso pendente.</div>`;
  } else {
    listaSlice.forEach(c=>{
      const t=AG_TIPOS[c.tipo]||AG_TIPOS.outro;
      const isH=c.data===hoje;
      const isPermanente=agEhPermanente(c);
      itensH+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:18px;flex-shrink:0">${t.emoji}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.titulo}</div>
          <div style="font-size:11px;color:${isPermanente?"var(--purple)":isH?"var(--blue)":"var(--text3)"};font-weight:${isPermanente||isH?"700":"500"};margin-top:2px">
            ${isPermanente?"🔁 Sempre":isH?"Hoje":agFmtDia(c.data)+", "+agFmtData(c.data)}${c.hora?" · "+c.hora:""}
          </div>
        </div>
        ${c.prioridade==="alta"?`<span style="font-size:10px;font-weight:800;color:var(--red);flex-shrink:0">⚡</span>`:""}
      </div>`;
    });
  }

  document.getElementById("esc").innerHTML=`<div class="esc">
    <div style="padding:14px 16px;border-bottom:1.5px solid var(--border);background:linear-gradient(135deg,var(--text) 0%,#3A2A1A 100%);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:16px;font-weight:800;color:white">🗓️ Agenda</div>
        <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:2px">${nHoje} compromisso${nHoje!==1?"s":""} hoje</div>
      </div>
      <button onclick="openAgendaSemana()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:var(--rs);color:white;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit">Próximos →</button>
    </div>
    <div style="padding:0 16px 4px">
      ${itensH}
    </div>
    <div style="padding:12px 16px;border-top:1.5px solid var(--border)">
      <button onclick="openAgendaNovo()" style="width:100%;padding:11px;border-radius:var(--rs);border:1.5px dashed var(--border-s);background:transparent;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">+ Novo compromisso</button>
    </div>
    <div style="padding:10px 16px;background:var(--surface2);border-top:1px solid var(--border)">
      <div style="text-align:center;color:var(--text3);font-size:12px">📅 Toque em um dia para ver a escala</div>
    </div>
  </div>`;
}

  const fimStr=document.getElementById("aus-fim").value;

  let dias=0;
  const diasIso=[];
  const cur=new Date(iniDate);
  while(cur<=fimDate){
    const mes=cur.getMonth(),dia=cur.getDate(),ano=cur.getFullYear();
    const k=`${mes}_${dia}`;
    if(!AUSENCIAS[k])AUSENCIAS[k]=[];

    removerDeQualquerPraca(func,dia,mes);
    const ds=`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
    if(!HISTORICO.find(h=>h.func===func&&h.ds===ds))HISTORICO.push({func,ds,motivo,setor:getSetorFunc(func)});
    diasIso.push(ds);
    dias++;cur.setDate(cur.getDate()+1);
  }
  cMod();renderEsc(d,mi);renderCal();
  showToast(dias>1?`⚠️ ${dias} dias registrados para ${func}`:`⚠️ Ausência: ${func}`);

// Descobre o período contínuo (mesmo motivo, dias consecutivos) que contém
// uma data específica — pra pré-preencher a edição com o período REAL, não
// só com o dia isolado que a pessoa tocou.
function periodoDaAusencia(nome,motivo,dsAlvo){
  const dias=HISTORICO.filter(h=>h.func===nome&&h.motivo===motivo).map(h=>h.ds);
  let ini=dsAlvo,fim=dsAlvo;
  while(true){
    const prev=new Date(ini+"T12:00:00");prev.setDate(prev.getDate()-1);
    const prevIso=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}-${String(prev.getDate()).padStart(2,"0")}`;
    if(dias.includes(prevIso))ini=prevIso;else break;
  }
  while(true){
    const next=new Date(fim+"T12:00:00");next.setDate(next.getDate()+1);
    const nextIso=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}-${String(next.getDate()).padStart(2,"0")}`;
    if(dias.includes(nextIso))fim=nextIso;else break;
  }
  return{ini,fim};
}
// Agrupa uma lista já ordenada por data (mesmo funcionário) em períodos
// contínuos por motivo — usado nos relatórios pra listar "períodos" em vez
// de linha por linha.
function agruparPeriodosPorMotivo(dadosOrdenados){
  const periodos=[];
  let atual=null;
  dadosOrdenados.forEach(r=>{
    if(atual&&atual.motivo===r.motivo){
      const prox=new Date(atual.fim+"T12:00:00");prox.setDate(prox.getDate()+1);
      const proxIso=`${prox.getFullYear()}-${String(prox.getMonth()+1).padStart(2,"0")}-${String(prox.getDate()).padStart(2,"0")}`;
      if(r.ds===proxIso){atual.fim=r.ds;return;}
    }
    if(atual)periodos.push(atual);
    atual={ini:r.ds,fim:r.ds,motivo:r.motivo};
  });
  if(atual)periodos.push(atual);
  return periodos;
}

function salvarEdicaoAusencia(nome,dsAntiga){
  const motivo=document.getElementById("ed-motivo").value;
  const iniStr=document.getElementById("ed-ini").value,fimStr=document.getElementById("ed-fim").value;
  if(!iniStr||!fimStr){alert("Informe o período.");return;}
  const iniDate=new Date(iniStr+"T12:00:00"),fimDate=new Date(fimStr+"T12:00:00");
  if(fimDate<iniDate){alert("Data fim não pode ser anterior ao início.");return;}
  const antigaDate=new Date(dsAntiga+"T12:00:00");
  // janela afetada = a data original do registro + o novo período escolhido.
  // Remove tudo nessa janela antes de reinserir — se o período for estendido
  // por cima de dias que já tinham registro próprio, evita duplicar (e evita
  // deixar HISTORICO em memória desincronizado do banco).
  const janelaIni=new Date(Math.min(antigaDate,iniDate));
  const janelaFim=new Date(Math.max(antigaDate,fimDate));
  const diasRemovidos=[];
  {
    const cur=new Date(janelaIni);
    while(cur<=janelaFim){
      const mes=cur.getMonth(),dia=cur.getDate(),ano=cur.getFullYear();
      const k=`${mes}_${dia}`;
      if(AUSENCIAS[k])AUSENCIAS[k]=AUSENCIAS[k].filter(n=>n!==nome);
      diasRemovidos.push(`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`);
      cur.setDate(cur.getDate()+1);
    }
  }
  HISTORICO=HISTORICO.filter(h=>!(h.func===nome&&diasRemovidos.includes(h.ds)));
  const diasIso=diasIsoEntre(iniStr,fimStr);
  diasIso.forEach(ds=>{
    const[ano,mes,dia]=ds.split("-").map(Number);
    const k=`${mes-1}_${dia}`;
    if(!AUSENCIAS[k])AUSENCIAS[k]=[];
    if(!AUSENCIAS[k].includes(nome))AUSENCIAS[k].push(nome);
    removerDeQualquerPraca(nome,dia,mes-1);
    HISTORICO.push({func:nome,ds,motivo,setor:getSetorFunc(nome)});
  });
  fecharEdicaoAusencia();
  renderCal();
  showToast("✅ Ausência de "+nome+" atualizada");
  persistirRemoverAusenciasRange(nome,diasRemovidos).then(()=>persistirAusenciaRange(nome,diasIso,motivo));
}
function confirmarRemoverPeriodoAusencia(nome,ini,fim){
  const dias=diasIsoEntre(ini,fim);
  const texto=dias.length>1?`Remover os ${dias.length} dias de ausência de ${nome} (${fmtData(ini)} a ${fmtData(fim)})? Essa ação não pode ser desfeita.`:`Remover a ausência de ${nome} em ${fmtData(ini)}? Essa ação não pode ser desfeita.`;
  if(!window.confirm(texto))return;
  removerPeriodoAusencia(nome,ini,fim);
}
function removerPeriodoAusencia(nome,ini,fim){
  const diasIso=diasIsoEntre(ini,fim);
  diasIso.forEach(ds=>{
    const[ano,mes,dia]=ds.split("-").map(Number);
    const k=`${mes-1}_${dia}`;
    if(AUSENCIAS[k])AUSENCIAS[k]=AUSENCIAS[k].filter(n=>n!==nome);
  });
  HISTORICO=HISTORICO.filter(h=>!(h.func===nome&&diasIso.includes(h.ds)));
  fecharEdicaoAusencia();
  renderCal();
  showToast("🗑️ Ausência removida");
  persistirRemoverAusenciasRange(nome,diasIso);
}

// HISTÓRICO
let relResumoAberto=true;
function openHistorico(){
  relResumoAberto=true;
  // Abre já filtrado no mês vigente (data real de hoje, não o mês que o
  // calendário porventura esteja mostrando) — gerente pode trocar depois.
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
  renderHistorico("todos",mesAtual);
}
function renderHistorico(filtroFunc,filtroMes){
  const base=HISTORICO;
  const funcs=[...new Set(base.map(h=>h.func))].sort();
  const meses=[...new Set(base.map(h=>h.ds.slice(0,7)))];
  // Garante que o mês do filtro atual apareça no <select> mesmo sem nenhum
  // registro ainda (ex: mês vigente recém-começado, sem ausência lançada) —
  // sem isso o dropdown ficaria sem nenhuma opção batendo com o filtro ativo.
  if(filtroMes!=="todos"&&!meses.includes(filtroMes))meses.push(filtroMes);
  meses.sort();
  let dados=base;
  if(filtroFunc!=="todos")dados=dados.filter(h=>h.func===filtroFunc);
  if(filtroMes!=="todos")dados=dados.filter(h=>h.ds.startsWith(filtroMes));
  dados=[...dados].sort((a,b)=>a.ds.localeCompare(b.ds));

  let dados=HISTORICO;

    ["Total de faltas/ausências",dados.length],

}

// alimenta FERIAS/feriasBanner/eFolga; só faltava a interface pra criar) ---
function periodosDeFerias(nome){
  const dias=FERIAS_ROWS.filter(h=>h.func===nome).map(h=>h.ds).sort();
  const periodos=[];
  let ini=null,fim=null;
  dias.forEach(ds=>{
    if(!ini){ini=ds;fim=ds;return;}
    const prox=new Date(fim+"T12:00:00");prox.setDate(prox.getDate()+1);
    const proxIso=`${prox.getFullYear()}-${String(prox.getMonth()+1).padStart(2,"0")}-${String(prox.getDate()).padStart(2,"0")}`;
    if(ds===proxIso){fim=ds;}
    else{periodos.push({ini,fim});ini=ds;fim=ds;}
  });
  if(ini)periodos.push({ini,fim});
  return periodos;
}
function diasIsoEntre(iniStr,fimStr){
  const dias=[];
  const cur=new Date(iniStr+"T12:00:00"),fimDate=new Date(fimStr+"T12:00:00");
  while(cur<=fimDate){
    const ano=cur.getFullYear(),mes=cur.getMonth(),dia=cur.getDate();
    dias.push(`${ano}-${String(mes+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`);
    cur.setDate(cur.getDate()+1);
  }
  return dias;
}

  const periodos=periodosDeFerias(fsFunc);
  let h=`<div class="mov" onclick="if(event.target===this){fsFunc=null;renderModalFolgas()}"><div class="mbox">

      </div>

  </div></div>`;

function salvarFeriasFuncionario(nome){
  const iniStr=document.getElementById("fer-ini").value,fimStr=document.getElementById("fer-fim").value;
  if(!iniStr||!fimStr){alert("Informe o período.");return;}
  if(new Date(fimStr+"T12:00:00")<new Date(iniStr+"T12:00:00")){alert("Data fim não pode ser anterior ao início.");return;}
  const diasIso=diasIsoEntre(iniStr,fimStr);
  // limpa qualquer ausência/férias antiga da pessoa nesses dias antes de registrar
  // (a constraint unique(funcionario_id,data) exige isso antes de reinserir)
  HISTORICO=HISTORICO.filter(h=>!(h.func===nome&&diasIso.includes(h.ds)));
  FERIAS_ROWS=FERIAS_ROWS.filter(h=>!(h.func===nome&&diasIso.includes(h.ds)));
  diasIso.forEach(ds=>FERIAS_ROWS.push({func:nome,ds,motivo:"Férias",setor:getSetorFunc(nome)}));
  // recalcula FERIAS/AUSENCIAS antes de mexer na escala, senão eFolga ainda não
  // sabe que a pessoa está de férias e removerDeQualquerPraca poderia congelar
  // uma escala manual nova sem necessidade num dia que hoje é 100% automático.
  recalcAusenciasDoMes();recalcFeriasDoMes();
  diasIso.forEach(ds=>{
    const[,mes,dia]=ds.split("-").map(Number);
    removerDeQualquerPraca(nome,dia,mes-1);
  });
  renderFeriasFunc();
  showToast("🏖️ Férias registradas para "+nome);
  persistirRemoverAusenciasRange(nome,diasIso).then(()=>persistirAusenciaRange(nome,diasIso,"Férias"));
}
function removerPeriodoFerias(nome,ini,fim){
  const diasIso=diasIsoEntre(ini,fim);
  FERIAS_ROWS=FERIAS_ROWS.filter(h=>!(h.func===nome&&diasIso.includes(h.ds)));
  recalcFeriasDoMes();
  renderFeriasFunc();
  showToast("↩ Férias removidas");
  persistirRemoverAusenciasRange(nome,diasIso);
}
function toggleFsDia(d){if(!fsDias[fsFunc])fsDias[fsFunc]=[];const idx=fsDias[fsFunc].indexOf(d);if(idx>=0)fsDias[fsFunc].splice(idx,1);else fsDias[fsFunc].push(d);renderCalFunc();}
function mudarFsMes(delta){fsMes+=delta;if(fsMes>11){fsMes=0;fsAno++;}if(fsMes<0){fsMes=11;fsAno--;}if(fsFunc)renderCalFunc();else renderModalFolgas();}
async function salvarFolgas(){
  const mi=gm();
  if(!FOLGAS[mi])FOLGAS[mi]={};
  const nomes=Object.keys(fsDias);
  const diasAntigos={};
  nomes.forEach(g=>{diasAntigos[g]=FOLGAS[mi][g]||[];});
  nomes.forEach(g=>{FOLGAS[mi][g]=fsDias[g];});
  // se um dia com folga vendida deixou de ser folga aqui, desfaz a venda também
  // (senão o registro fica órfão e continua aparecendo no relatório de vendas)
  nomes.forEach(g=>{
    const diasRemovidos=diasAntigos[g].filter(d=>!fsDias[g].includes(d));
    diasRemovidos.forEach(d=>{
      if((FOLGAS_VENDIDAS[`${mi}_${d}`]||[]).includes(g)) desfazerVendaDeFolgaDados(g,d,mi);
    });
  });
  cMod();if(dSel)renderEsc(dSel,mi);renderCal();
  showToast("✅ Folgas de "+MN[mi]+" atualizadas!");
  await Promise.all(nomes.map(g=>persistirFolgasFuncionario(g,mi,fsAno,fsDias[g])));
}

    h+=`<div class="aus-empty">Nenhum ajuste pontual para este dia.</div>`;
  }else{
    h+=`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">${nomesComHorario.map(nome=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--surface2)">
        <span style="font-weight:700">${nome}</span>

        </div>

    h+=`<div style="border-top:1px solid var(--border);padding-top:12px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Adicionar ajuste</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select id="hp-func" style="flex:1;min-width:140px">${disponiveisSemHorario.map(x=>`<option value="${x.nome}">${x.nome}</option>`).join("")}</select>
        <input type="text" id="hp-hora" placeholder="ex: 14h" style="width:90px;font-size:13px;padding:9px 10px;border-radius:var(--rs);border:1.5px solid var(--border-s);font-family:inherit">

async function adicionarHorarioPontualUI(d,mi){

  {k:'Terça',n:'Terça-feira',e:'📅'},
  {k:'Quarta',n:'Quarta-feira',e:'📅'},

];

function renderConfigDiasFuncionamento(){
  const rows=window._diasFechadosRows||[];
  let h=`<div class="mov" onclick="if(event.target===this)abrirDrawer()"><div class="mbox" style="max-height:85vh;overflow-y:auto">
    <div class="cal-modal-hd"><h3>🔒 Dias de funcionamento</h3><button class="cal-close" onclick="abrirDrawer()">‹</button></div>
    <p class="msub">Marque os dias em que o restaurante <strong>não</strong> funciona.</p>`;
  DIAS_FUNC_INFO.forEach(d=>{
    const row=rows.find(r=>r.dia_semana===d.k);
    const fechado=!!row;

    h+=`<div style="background:var(--surface);border:1.5px solid ${fechado?"var(--red-br)":"var(--border)"};border-radius:var(--rs);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)">

        <div style="display:flex;align-items:center;gap:10px">

        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${fechado?`<span style="font-size:11px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:20px;padding:2px 10px">Fechado</span>`:`<span style="font-size:11px;color:var(--text3)">Aberto</span>`}

        </div>
      </div>
      ${fechado?`<div class="master-only" style="border-top:1px solid var(--red-br);background:var(--red-bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--red);font-weight:600;align-self:center">Fecha:</span>
        ${[["todos","Dia todo"],["almoco","Só almoço"],["jantar","Só jantar"]].map(([v,l])=>`
          <button onclick="setTurnoFechadoConfig('${d.k}','${v}')" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${turno===v?"var(--red)":"var(--red-br)"};background:${turno===v?"var(--red)":"transparent"};color:${turno===v?"white":"var(--red)"};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${turno===v?"✓ ":""}${l}</button>
        `).join("")}
      </div>`:""}
    </div>`;

  h+=`<p style="font-size:12px;color:var(--text3);text-align:center;margin:8px 0 0">Não selecionado = aberto nesse dia</p>
  <div class="macts"><button onclick="abrirDrawer()">‹ Voltar</button></div>
  </div></div>`;
  document.getElementById("modal").innerHTML=h;
}
async function toggleDiaFechadoConfig(dia){
  const rows=window._diasFechadosRows||[];
  const nomeDia=(DIAS_FUNC_INFO.find(d=>d.k===dia)||{}).n||dia;
  const idx=rows.findIndex(r=>r.dia_semana===dia);
  if(idx>=0){
    const row=rows[idx];
    const{error}=await supabaseClient.from("dias_fechados").delete().eq("id",row.id);
    if(error){avisoErro("Não foi possível reabrir "+nomeDia+".");return;}
    rows.splice(idx,1);
    delete FJ[dia];
    showToast("✅ "+nomeDia+" reaberto(a).");
  } else {
    const{data,error}=await supabaseClient.from("dias_fechados")
      .insert({restaurante_id:RESTAURANTE_ID,dia_semana:dia,turno:"todos"}).select().single();
    if(error){avisoErro("Não foi possível fechar "+nomeDia+".");return;}
    rows.push(data);
    FJ[dia]="todos";
    showToast("🔒 "+nomeDia+" marcado(a) como fechado(a).");
  }
  renderConfigDiasFuncionamento();
  if(dSel)renderEsc(dSel,gm());
}
async function setTurnoFechadoConfig(dia,turno){
  const rows=window._diasFechadosRows||[];
  const row=rows.find(r=>r.dia_semana===dia);
  if(!row)return;
  const nomeDia=(DIAS_FUNC_INFO.find(d=>d.k===dia)||{}).n||dia;
  const{error}=await supabaseClient.from("dias_fechados").update({turno}).eq("id",row.id);
  if(error){avisoErro("Não foi possível atualizar o turno de "+nomeDia+".");return;}
  row.turno=turno;
  FJ[dia]=turno;
  renderConfigDiasFuncionamento();
  if(dSel)renderEsc(dSel,gm());
}

  if(uploadError){avisoErro("Não foi possível enviar o logo.");return;}

  const url=pub.publicUrl+"?t="+Date.now();
  const{error:updError}=await supabaseClient.from("restaurantes").update({logo_url:url}).eq("id",RESTAURANTE_ID);
  if(updError){avisoErro("Logo enviado, mas não foi possível salvar no restaurante.");return;}

// Toda escrita (criar/resetar PIN/remover) passa pela Edge Function
// "gerenciar-acesso" (service_role, valida as regras no servidor de novo —
// esta tela só reflete visualmente o que cada nível pode fazer).
let ACESSOS=[];
// Mesmo gerador de slug do onboarding (public/onboarding.html gerarSlug) —
// duplicado aqui porque as duas páginas não compartilham bundler/import.
function gerarSlug(nome){
  return (nome||"")
    .toLowerCase()
    .normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]","g"),"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60)||"restaurante";
}
function linkLoginEquipe(){
  if(!RESTAURANTE_SLUG)return "";
  const base=location.href.replace(/painel\.html.*$/,"");
  return base+"login/"+RESTAURANTE_SLUG;
}
function copiarLinkLoginEquipe(){
  const link=linkLoginEquipe();
  if(!link)return;
  navigator.clipboard.writeText(link).then(()=>{
    showToast("✅ Link copiado!");
  }).catch(()=>{
    avisoErro("Não foi possível copiar. Selecione o link manualmente.");
  });
}
async function gerarLinkLoginEquipe(){
  const slugBase=gerarSlug(RESTAURANTE_NOME);
  for(let tentativa=0;tentativa<5;tentativa++){
    const slugTentativa=tentativa===0?slugBase:`${slugBase}-${tentativa+1}`;
    const{error}=await supabaseClient.from("restaurantes").update({slug:slugTentativa}).eq("id",RESTAURANTE_ID);
    if(!error){
      RESTAURANTE_SLUG=slugTentativa;
      renderConfigAcessos();
      showToast("✅ Link de login gerado!");
      return;
    }
    if(error.code!=="23505"){avisoErro("Não foi possível gerar o link.");return;}
  }
  avisoErro("Não foi possível gerar o link. Tente novamente.");
}
// Reaproveita gerarLinkLoginEquipe mesmo com um slug já existente — serve
// tanto pra "trocar de propósito" quanto pra corrigir um valor incorreto
// (ex: escrito errado direto no banco), já que hoje não existe outra forma
// de regenerar pela interface uma vez que RESTAURANTE_SLUG deixa de ser nulo.
async function confirmarGerarNovoLinkLoginEquipe(){
  if(!window.confirm("Isso substitui o link de login da equipe atual. Se alguém já salvou o link antigo, ele deixa de funcionar — você vai precisar compartilhar o novo. Continuar?"))return;
  await gerarLinkLoginEquipe();
}

async function carregarAcessos(){
  const{data,error}=await supabaseClient
    .from("perfis_acesso")
    .select("id,nivel_acesso,funcionario_id,nome_exibicao")
    .order("nivel_acesso");
  if(error){avisoErro("Não foi possível carregar os acessos.");ACESSOS=[];return;}
  // Resolve o nome localmente via FUNC_ID_POR_NOME (já carregado no boot) em
  // vez do embed funcionarios(nome) do PostgREST — funcionario_id é unique
  // e anulável em perfis_acesso, e nessa combinação o embed automático
  // não resolve (volta null mesmo com FK e RLS corretas).
  // Acessos antigos criados pelo script (caminho "liderança sem vínculo")
  // não têm funcionario_id — usam nome_exibicao. A v1 desta tela não cria
  // esse tipo de acesso, mas precisa continuar exibindo os que já existem.
  const nomePorId={};
  Object.entries(FUNC_ID_POR_NOME).forEach(([nome,id])=>{nomePorId[id]=nome;});
  ACESSOS=(data||[])
    .filter(r=>r.nivel_acesso!=="master")
    .map(r=>({id:r.id,nivel:r.nivel_acesso,funcionarioId:r.funcionario_id,nome:nomePorId[r.funcionario_id]||r.nome_exibicao||"—"}));
}
function funcionariosSemAcesso(){
  const idsComAcesso=new Set(ACESSOS.map(a=>a.funcionarioId).filter(Boolean));
  const todos=[...new Set(Object.values(EQ).flatMap(e=>e.m))];
  return todos.filter(nome=>{
    const id=FUNC_ID_POR_NOME[nome];
    return id&&!idsComAcesso.has(id);
  }).sort();
}

  const funcEl=document.getElementById("acs-func");

// --- Relatório: Extras (quantidade e custo, por semana) ---
// Diferente dos outros relatórios (que pré-carregam um histórico inteiro no
// boot()), aqui busco só a semana visualizada, direto do banco, a cada
// navegação — mais simples que manter um histórico completo em memória pra
// uma tela que já é naturalmente recortada por semana.
let EXTRAS_SEMANA_REF=null; // uma data (Date) dentro da semana em exibição
let EXTRAS_SEMANA_DADOS=[];
let EXTRAS_FILTRO_FUNC="todos"; // filtro de funcionário, persiste ao navegar entre semanas
function segundaDaSemana(dt){
  const d=new Date(dt);
  const dow=d.getDay();
  d.setDate(d.getDate()+(dow===0?-6:1-dow));
  d.setHours(0,0,0,0);
  return d;
}
function dataParaISO(dt){
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
async function openRelatorioExtras(){
  EXTRAS_SEMANA_REF=EXTRAS_SEMANA_REF||new Date();
  EXTRAS_FILTRO_FUNC="todos";
  await carregarRelatorioExtras();
}
async function carregarRelatorioExtras(){
  const seg=segundaDaSemana(EXTRAS_SEMANA_REF),dom=new Date(seg);dom.setDate(dom.getDate()+6);
  const{data,error}=await supabaseClient.from("extras").select("*").eq("restaurante_id",RESTAURANTE_ID).gte("data",dataParaISO(seg)).lte("data",dataParaISO(dom));
  if(error){avisoErro("Não foi possível carregar os extras da semana.");return;}
  EXTRAS_SEMANA_DADOS=(data||[]).map(r=>({nome:r.nome,ds:r.data,area:nomeDaAreaExtra(r.alvo),valor:r.valor!=null?Number(r.valor):null,funcao:r.funcao||null}));
  renderRelatorioExtras();
}
async function extrasSemanaPrev(){const seg=segundaDaSemana(EXTRAS_SEMANA_REF);seg.setDate(seg.getDate()-7);EXTRAS_SEMANA_REF=seg;await carregarRelatorioExtras();}
async function extrasSemanaNext(){const seg=segundaDaSemana(EXTRAS_SEMANA_REF);seg.setDate(seg.getDate()+7);EXTRAS_SEMANA_REF=seg;await carregarRelatorioExtras();}
// Recorta EXTRAS_SEMANA_DADOS pelo filtro de funcionário ativo (persiste
// entre navegações de semana — trocar de semana com um funcionário
// selecionado continua mostrando só os registros dele/dela).
function extrasDadosFiltrados(){
  return EXTRAS_FILTRO_FUNC==="todos"?EXTRAS_SEMANA_DADOS:EXTRAS_SEMANA_DADOS.filter(r=>r.nome===EXTRAS_FILTRO_FUNC);
}
// Agrupa uma lista de extras por uma chave (área, função ou nome), somando
// quantidade e valor — mesmo cálculo reaproveitado pelos 3 blocos de resumo
// (Por área, Por função, Resumo por funcionário) e pelo Excel.
function agruparExtras(dados,chave){
  const grupos={};
  dados.forEach(r=>{
    const k=r[chave];
    if(!k)return; // função é opcional: registros sem função ficam fora do "Por função"
    if(!grupos[k])grupos[k]={qtd:0,total:0,lid:false};
    grupos[k].qtd++;
    grupos[k].total+=(r.valor||0);
    if(chave==="nome"&&funcaoELideranca(r.funcao))grupos[k].lid=true;
  });
  return Object.entries(grupos).sort((a,b)=>b[1].total-a[1].total);
}
function extrasBlocoResumoHtml(titulo,emoji,entradas,unidade){
  if(entradas.length===0)return "";
  return `<div class="fs-setor" style="margin-bottom:12px">
    <div class="fs-setor-hd"><div class="fs-setor-left"><span style="font-size:20px">${emoji}</span>
      <div><div class="fs-setor-nm">${titulo}</div><div class="fs-setor-sub">${entradas.length} ${unidade}${entradas.length!==1?"s":""}</div></div>
    </div></div>
    <div class="fs-setor-body">${entradas.map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="font-weight:600">${(v.lid||funcaoELideranca(k))?ICONE_LIDERANCA_EXTRA+" ":""}${k}</span><span style="display:flex;align-items:center;gap:8px"><span style="color:var(--text2)">${v.qtd}×</span><span style="font-weight:800;color:var(--green)">R$${fmtValorExtra(v.total)||"0"}</span></span></div>`).join("")}</div>
  </div>`;
}
function renderRelatorioExtras(){
  const todos=EXTRAS_SEMANA_DADOS;
  const nomesUnicos=[...new Set(todos.map(r=>r.nome))].sort();
  const dados=extrasDadosFiltrados();

};

async function migrarAgendaLocalStorage(){
  if(localStorage.getItem("bt_agenda_migrado"))return;
  let dadosAntigos=[];
  try{
    const d=localStorage.getItem("bt_agenda");
    if(d)dadosAntigos=JSON.parse(d);
  }catch(e){}
  if(!Array.isArray(dadosAntigos)||dadosAntigos.length===0){
    try{localStorage.setItem("bt_agenda_migrado","1");}catch(e){}
    return;
  }
  const mapaGrupo={};
  const linhas=dadosAntigos.map(c=>{
    let grupoId=null;
    if(c.grupoId){
      if(!mapaGrupo[c.grupoId])mapaGrupo[c.grupoId]=crypto.randomUUID();
      grupoId=mapaGrupo[c.grupoId];
    }
    return{
      restaurante_id:RESTAURANTE_ID,criado_por:USER_ID,
      titulo:c.titulo,data:c.data,hora:c.hora||null,
      tipo:AG_TIPOS[c.tipo]?c.tipo:"outro",
      prioridade:c.prioridade||"normal",descricao:c.desc||null,
      recorrencia:c.recorrencia||"nunca",grupo_id:grupoId,
      concluido:!!c.concluido,visibilidade:"compartilhado",
      pax_esperado:null,praca_id:null,
    };
  });
  const{error}=await supabaseClient.from("agenda_compromissos").insert(linhas);
  if(!error){
    try{localStorage.setItem("bt_agenda_migrado","1");}catch(e){}
  }
}
function agHoje(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function agIsHoje(ds){return ds===agHoje();}
function agIsSemana(ds){
  const now=new Date(),ini=new Date(now);ini.setDate(now.getDate()-now.getDay());
  const fim=new Date(ini);fim.setDate(ini.getDate()+6);
  const dt=new Date(ds+"T12:00:00");return dt>=ini&&dt<=fim;
}
function agFmtData(ds){const[y,m,d]=ds.split("-");return `${d}/${m}/${y}`;}
function agFmtDia(ds){const dt=new Date(ds+"T12:00:00");return DS_SEM[dt.getDay()];}
function agFmtDiaCompleto(ds){const dt=new Date(ds+"T12:00:00");const[y,m,d]=ds.split("-");return `${DS_SEM[dt.getDay()]}, ${parseInt(d)} de ${MN[parseInt(m)-1]}`;}

function agEhPermanente(c){return c.tipo==="tarefa"&&!c.data;}
function agGetFiltrados(){
  let l=[...AGENDA];
  // Evento só aparece na própria aba "🎉 Eventos" — nunca nas visões gerais.
  if(agFiltro!=="evento") l=l.filter(c=>c.tipo!=="evento");
  if(agFiltro==="hoje") l=l.filter(c=>agEhPermanente(c)||agIsHoje(c.data));
  else if(agFiltro==="semana") l=l.filter(c=>agEhPermanente(c)||agIsSemana(c.data));
  else if(agFiltro==="pendente") l=l.filter(c=>!c.concluido);
  else if(agFiltro==="proximos7"){
    const hoje=agHoje();
    const fim=new Date();fim.setDate(fim.getDate()+7);
    const fimStr=fim.toISOString().split("T")[0];
    l=l.filter(c=>(agEhPermanente(c)||(c.data>=hoje&&c.data<=fimStr))&&!c.concluido);
  }
  else if(["reuniao","tarefa","compromisso","operacao","evento","outro"].includes(agFiltro)) l=l.filter(c=>c.tipo===agFiltro);
  l=l.sort((a,b)=>{
    if(!a.data&&!b.data)return 0;
    if(!a.data)return -1;
    if(!b.data)return 1;
    if(a.data!==b.data)return a.data.localeCompare(b.data);
    if(a.hora&&b.hora)return a.hora.localeCompare(b.hora);
    return 0;
  });

  // recorrentes: mostrar APENAS a próxima ocorrência (hoje ou futura)
  const gruposVistos={};
  const resultado=[];
  const hoje=agHoje();
  l.forEach(c=>{
    if(!c.grupoId){resultado.push(c);return;}
    if(!gruposVistos[c.grupoId]&&c.data>=hoje){
      gruposVistos[c.grupoId]=true;
      resultado.push({...c,_primeiroDoGrupo:true});
    }
  });
  return resultado;
}

// Primeiro item datado (não permanente), hoje ou futuro, ainda não concluído —
// pra onde a Agenda deve abrir já rolada na aba "Todos" (que mistura passado
// e futuro na mesma lista). Itens permanentes ("Sempre") já flutuam pro topo
// sozinhos na ordenação, então não entram nessa busca.
function agPrimeiroPendenteId(lista){
  const hoje=agHoje();
  const alvo=lista.find(c=>c.data&&c.data>=hoje&&!c.concluido);
  return alvo?alvo.id:null;
}
function agRolarParaPrimeiroPendente(){

    if(el)el.scrollIntoView({behavior:"smooth",block:"start"});

}

}
function agParseData(val){
  // aceita DD/MM/AAAA
  const parts=val.split("/");
  if(parts.length===3&&parts[2].length===4){
    const iso=`${parts[2]}-${parts[1].padStart(2,"0")}-${parts[0].padStart(2,"0")}`;
    const el=document.getElementById("ag-data");
    if(el) el.value=iso;
  }
}
async function agSalvar(){
  const titulo=document.getElementById("ag-titulo").value.trim();
  // ler data do campo display e converter DD/MM/AAAA → AAAA-MM-DD
  const dispEl=document.getElementById("ag-data-display");
  let data=agPermanente?null:(dispEl&&dispEl.value?dispEl.value:agHoje());
  if(!titulo){alert("Informe o título.");return;}
  const recorEl=document.getElementById("ag-recor");
  const recorrencia=agPermanente?"nunca":recorEl.value;
  const horaEl=document.getElementById("ag-hora");
  const hora=agPermanente?"":horaEl.value;
  const tipo=agTipo;
  const prioridade=document.getElementById("ag-prior").value;
  const descEl=document.getElementById("ag-desc");const desc=descEl?descEl.value.trim():"";
  const visibilidade=document.getElementById("ag-vis").value;
  const paxEl=document.getElementById("ag-pax");
  const paxEsperado=tipo==="evento"&&paxEl&&paxEl.value?parseInt(paxEl.value,10):null;
  const pracaEl=document.getElementById("ag-praca");
  const pracaId=tipo==="evento"&&pracaEl&&pracaEl.value?pracaEl.value:null;

  // se editando, remove o antigo (e suas recorrências geradas) antes de recriar
  if(agEditId){
    const orig=AGENDA.find(x=>x.id===agEditId);
    let apagados,error;
    if(orig&&orig.grupoId){
      ({data:apagados,error}=await supabaseClient.from("agenda_compromissos").delete().eq("grupo_id",orig.grupoId).select("id"));
    } else {
      ({data:apagados,error}=await supabaseClient.from("agenda_compromissos").delete().eq("id",agEditId).select("id"));
    }
    if(error||!apagados||apagados.length===0){avisoErro("Sem permissão para editar este compromisso.");return;}
  }

  const grupoId=recorrencia!=="nunca"?crypto.randomUUID():null;
  const linhas=[{
    restaurante_id:RESTAURANTE_ID,criado_por:USER_ID,
    titulo,data,hora:hora||null,tipo,prioridade,descricao:desc||null,
    recorrencia,grupo_id:grupoId,concluido:false,
    visibilidade,pax_esperado:paxEsperado,praca_id:pracaId,
  }];

  // gerar próximas ocorrências (até 6 meses)
  if(recorrencia!=="nunca"){
    const intervalos={semanal:7,quinzenal:14,mensal:30};
    const dias=intervalos[recorrencia]||7;
    let cur=new Date(data+"T12:00:00");
    const limite=new Date(cur);limite.setMonth(limite.getMonth()+6);
    for(let i=0;i<50;i++){
      if(recorrencia==="mensal") cur.setMonth(cur.getMonth()+1);
      else cur.setDate(cur.getDate()+dias);
      if(cur>limite) break;
      const ds=cur.toISOString().split("T")[0];
      linhas.push({
        restaurante_id:RESTAURANTE_ID,criado_por:USER_ID,
        titulo,data:ds,hora:hora||null,tipo,prioridade,descricao:desc||null,
        recorrencia,grupo_id:grupoId,concluido:false,
        visibilidade,pax_esperado:paxEsperado,praca_id:pracaId,
      });
    }
  }

  const{error:insError}=await supabaseClient.from("agenda_compromissos").insert(linhas);
  if(insError){avisoErro("Não foi possível salvar o compromisso.");return;}
  await carregarAgenda();
  renderAgendaModal();renderEmpty();
  const msg=recorrencia!=="nunca"?`✅ Compromisso recorrente criado!`:`✅ ${agEditId?"Atualizado":"Compromisso adicionado"}`;
  showToast(msg);
  agEditId=null;
}

async function carregarEquipeEPracas(){
  const{data:setoresRows}=await supabaseClient
    .from("setores")
    .select("*, funcionarios(id,nome,cargo,praca_preferencial_id,data_inicio)")
    .eq("restaurante_id",RESTAURANTE_ID)
    .order("ordem");

  EQ={};FUNC_ID_POR_NOME={};CARGO_POR_NOME={};DATA_INICIO_POR_NOME={};
  const pracaPreferidaPorFuncionario={};
  (setoresRows||[]).forEach(s=>{
    EQ[s.chave]={id:s.id,l:s.nome,e:s.emoji||"",c:s.cor||"#4A4A4A",min:s.min_funcionarios||1,m:[]};
    (s.funcionarios||[]).forEach(f=>{
      EQ[s.chave].m.push(f.nome);
      FUNC_ID_POR_NOME[f.nome]=f.id;
      if(f.cargo)CARGO_POR_NOME[f.nome]=f.cargo;
      if(f.data_inicio)DATA_INICIO_POR_NOME[f.nome]=f.data_inicio;
      if(f.praca_preferencial_id){
        if(!pracaPreferidaPorFuncionario[f.praca_preferencial_id])pracaPreferidaPorFuncionario[f.praca_preferencial_id]=[];
        pracaPreferidaPorFuncionario[f.praca_preferencial_id].push(f.nome);
      }
    });
  });

  const{data:pracasRows}=await supabaseClient
    .from("pracas").select("*").eq("restaurante_id",RESTAURANTE_ID).order("ordem");
  PD=(pracasRows||[]).map(p=>({
    id:p.id,n:p.nome,pref:false,fch:false,
    gc:pracaPreferidaPorFuncionario[p.id]||[],
    mesas:"",tm:p.mesas,tl:p.lugares,fimSemana:!!p.fim_semana,
    mesasConfig:(p.mesas_config&&p.mesas_config.length>0)?p.mesas_config:mcEstimarLinhas(p.mesas,p.lugares),
  }));
  recalcTotais();
}
// Gera o miolo de .logo-wrap: imagem real do restaurante quando existe
// RESTAURANTE_LOGO_URL, ou um fallback com as iniciais do nome num círculo
// colorido (cor derivada do nome, estável entre sessões) quando não há logo
// próprio enviado ainda — nunca deixa um placeholder genérico de cliente
// nenhum vazando pra outro restaurante.
function logoOuFallbackHtml(px){
  if(RESTAURANTE_LOGO_URL){
    const alt=(RESTAURANTE_NOME||"Logo").replace(/"/g,"&quot;");
    return `<img src="${RESTAURANTE_LOGO_URL}" alt="${alt}" style="width:100%;height:100%;object-fit:cover">`;
  }
  const nome=(RESTAURANTE_NOME||"").trim();
  const palavras=nome.split(/\s+/).filter(Boolean);
  const iniciais=((palavras[0]?.[0]||"")+(palavras[1]?.[0]||"")).toUpperCase();
  const cores=["#B02020","#378ADD","#2E9E5B","#C77D2E","#7B4FA0","#1F8A8C"];
  let hash=0;for(let i=0;i<nome.length;i++)hash=(hash*31+nome.charCodeAt(i))>>>0;
  const cor=cores[hash%cores.length];
  const fs=Math.round(px*0.36);
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${cor};color:white;font-weight:800;font-size:${fs}px;letter-spacing:.02em;font-family:inherit">${iniciais||"🍽️"}</div>`;
}
function aplicarLogoNoHeader(){
  const wrap=document.querySelector(".logo-wrap");
  if(wrap)wrap.innerHTML=logoOuFallbackHtml(52);
}

async function carregarHistorico(){
  const{data,error}=await supabaseClient
    .from("ausencias")
    .select("data,motivo,funcionarios(nome)")
    .order("data");
  if(error){avisoErro("Não foi possível carregar o histórico de ausências.");return;}
  const linhas=(data||[]).map(r=>({
    func:r.funcionarios?r.funcionarios.nome:"",
    ds:r.data,
    motivo:r.motivo,
    setor:getSetorFunc(r.funcionarios?r.funcionarios.nome:""),
  })).filter(h=>h.func);
  // Férias é um status à parte — não conta como ausência/falta em nenhuma listagem.
  HISTORICO=linhas.filter(h=>h.motivo!=="Férias");
  FERIAS_ROWS=linhas.filter(h=>h.motivo==="Férias");
}

async function carregarHistoricoFolgasVendidas(){
  const{data,error}=await supabaseClient
    .from("folgas_vendidas")
    .select("data,valor,funcionarios(nome)")
    .eq("tipo","domingo")
    .order("data");
  if(error){avisoErro("Não foi possível carregar o histórico de vendas de folga.");return;}
  HISTORICO_FOLGAS_VENDIDAS=(data||[]).map(r=>({
    func:r.funcionarios?r.funcionarios.nome:"",
    ds:r.data,
    setor:getSetorFunc(r.funcionarios?r.funcionarios.nome:""),
    valor:r.valor!=null?Number(r.valor):null,
  })).filter(h=>h.func);
}
async function carregarHistoricoFolgasVendidasSemana(){
  const{data,error}=await supabaseClient
    .from("folgas_vendidas")
    .select("data,valor,funcionarios(nome)")

}

function recalcAusenciasDoMes(){
  AUSENCIAS={};
  HISTORICO.forEach(h=>{
    const[ano,mes,dia]=h.ds.split("-").map(Number);
    if(ano!==cy)return;
    const key=`${mes-1}_${dia}`;
    if(!AUSENCIAS[key])AUSENCIAS[key]=[];
    if(!AUSENCIAS[key].includes(h.func))AUSENCIAS[key].push(h.func);
  });
}

function recalcFeriasDoMes(){
  FERIAS={};
  FERIAS_ROWS.forEach(h=>{
    const[ano,mes,dia]=h.ds.split("-").map(Number);
    if(ano!==cy)return;
    const mi=mes-1;
    if(!FERIAS[mi])FERIAS[mi]=[];
    if(!FERIAS[mi].includes(h.func))FERIAS[mi].push(h.func);
  });
}

function nomesComE(itens){
  if(itens.length<=1)return itens[0]||"";
  return itens.slice(0,-1).join(", ")+" e "+itens[itens.length-1];
}
function eventoBanner(ds){
  const eventos=AGENDA.filter(c=>c.tipo==="evento"&&c.data===ds&&!c.concluido);
  if(!eventos.length)return "";
  return eventos.map(ev=>{
    const praca=ev.pracaId?(PD.find(p=>p.id===ev.pracaId)?.n||"Restaurante todo"):"Restaurante todo";
    const pax=ev.paxEsperado||0;
    return `<div class="albox alev" style="cursor:pointer" onclick="abrirModalEvento('${ev.id}')">🎉 <span>Evento: ${ev.titulo} — ${pax} pax — ${praca}</span></div>`;
  }).join("");
}
function feriasBanner(mi,extraStyle){
  const nomes=FERIAS[mi]||[];
  if(!nomes.length)return "";
  const proxMes=MN[(mi+1)%12];
  const texto=nomesComE(nomes.map(n=>`<strong>${n}</strong>`));
  return `<div class="albox alor"${extraStyle?` style="${extraStyle}"`:""}>🏖️ <span>${texto} de férias em ${MN[mi]} — retorna${nomes.length>1?"m":""} em ${proxMes}.</span></div>`;
}

async function carregarOperacional(){
  const ultimoDia=new Date(cy,cm+1,0).getDate();
  const inicio=`${cy}-${String(cm+1).padStart(2,"0")}-01`;
  const fim=`${cy}-${String(cm+1).padStart(2,"0")}-${String(ultimoDia).padStart(2,"0")}`;

  FOLGAS={};RES={};EXTRAS={};ESCALA_MANUAL={};FOLGAS_VENDIDAS={};HORARIOS_PONTUAIS={};

  const[folgasRes,resRes,extrasRes,escalaRes,fvRes,hpRes]=await Promise.all([
    supabaseClient.from("folgas").select("data,funcionarios(nome)").gte("data",inicio).lte("data",fim),
    supabaseClient.from("reservas").select("*").eq("restaurante_id",RESTAURANTE_ID).gte("data",inicio).lte("data",fim),
    supabaseClient.from("extras").select("*").eq("restaurante_id",RESTAURANTE_ID).gte("data",inicio).lte("data",fim),
    supabaseClient.from("escala_manual").select("*").eq("restaurante_id",RESTAURANTE_ID).gte("data",inicio).lte("data",fim),
    supabaseClient.from("folgas_vendidas").select("data,funcionarios(nome)").gte("data",inicio).lte("data",fim),
    supabaseClient.from("horarios_pontuais").select("data,hora,funcionarios(nome)").gte("data",inicio).lte("data",fim),
  ]);

  FOLGAS[cm]=FOLGAS[cm]||{};
  (folgasRes.data||[]).forEach(r=>{
    const nome=r.funcionarios?r.funcionarios.nome:null;if(!nome)return;
    const dia=parseInt(r.data.split("-")[2],10);
    if(!FOLGAS[cm][nome])FOLGAS[cm][nome]=[];
    FOLGAS[cm][nome].push(dia);
  });

  (resRes.data||[]).forEach(r=>{
    const dia=parseInt(r.data.split("-")[2],10);
    RES[`${cm}_${dia}_${r.turno==="almoco"?"a":"j"}`]=r.quantidade;
  });

  (extrasRes.data||[]).forEach(r=>{
    const dia=parseInt(r.data.split("-")[2],10);
    const k=`${r.alvo}_${cm}_${dia}`;
    if(!EXTRAS[k])EXTRAS[k]=[];
    EXTRAS[k].push({nome:r.nome,valor:r.valor!=null?Number(r.valor):null,funcao:r.funcao||null});
  });

  (escalaRes.data||[]).forEach(r=>{
    const dia=parseInt(r.data.split("-")[2],10);
    ESCALA_MANUAL[`${cm}_${dia}_${r.turno||"a"}`]=r.distribuicao;
  });

  (fvRes.data||[]).forEach(r=>{
    const nome=r.funcionarios?r.funcionarios.nome:null;if(!nome)return;
    const dia=parseInt(r.data.split("-")[2],10);
    const k=`${cm}_${dia}`;
    if(!FOLGAS_VENDIDAS[k])FOLGAS_VENDIDAS[k]=[];
    FOLGAS_VENDIDAS[k].push(nome);
  });

  (hpRes.data||[]).forEach(r=>{
    const nome=r.funcionarios?r.funcionarios.nome:null;if(!nome)return;
    const dia=parseInt(r.data.split("-")[2],10);
    const k=`${cm}_${dia}`;
    if(!HORARIOS_PONTUAIS[k])HORARIOS_PONTUAIS[k]={};
    HORARIOS_PONTUAIS[k][nome]=r.hora;
  });

  recalcAusenciasDoMes();
  recalcFeriasDoMes();
}

async function boot(){
  const{data:sessionData}=await supabaseClient.auth.getSession();
  if(!sessionData.session){window.location.href="login";return;}
  const userId=sessionData.session.user.id;
  USER_ID=userId;

  // Caminho do dono (Master) — igual a antes, sem nenhuma mudança de comportamento.
  const{data:restauranteDono,error:restErrorDono}=await supabaseClient
    .from("restaurantes").select("*").eq("owner_id",userId).maybeSingle();

  let restaurante=restauranteDono;
  if(restaurante&&!restErrorDono){
    NIVEL_ACESSO="master";
  } else {
    // Fallback só entra aqui se o caminho do dono não achar nada: funcionário com
    // login por PIN, vinculado via perfis_acesso (nunca mexe no caminho de cima).
    const{data:perfil}=await supabaseClient
      .from("perfis_acesso").select("restaurante_id,nivel_acesso").eq("id",userId).maybeSingle();
    if(!perfil){window.location.href="onboarding.html";return;}
    const{data:restauranteFuncionario}=await supabaseClient
      .from("restaurantes").select("*").eq("id",perfil.restaurante_id).maybeSingle();
    if(!restauranteFuncionario){window.location.href="onboarding.html";return;}
    restaurante=restauranteFuncionario;
    NIVEL_ACESSO=perfil.nivel_acesso;
  }
  document.body.classList.toggle("nivel-consulta",NIVEL_ACESSO==="consulta");
  document.body.classList.toggle("nivel-nao-master",NIVEL_ACESSO!=="master");

  RESTAURANTE_ID=restaurante.id;
  RESTAURANTE_NOME=restaurante.nome;
  RESTAURANTE_LOGO_URL=restaurante.logo_url||null;
  RESTAURANTE_SLUG=restaurante.slug||null;
  document.title=RESTAURANTE_NOME+" — Gestão de Salão";
  const h1=document.querySelector(".header-info h1");if(h1)h1.textContent=RESTAURANTE_NOME;
  const sub=document.querySelector(".header-info p");if(sub)sub.textContent=(restaurante.cidade||"")+" · Gestão de Salão";
  aplicarLogoNoHeader();

  await carregarEquipeEPracas();

  const{data:horariosRows}=await supabaseClient
    .from("horarios_especiais")
    .select("dias,hora,funcionarios(nome)");
  HORARIOS={};
  (horariosRows||[]).forEach(r=>{
    const nome=r.funcionarios?r.funcionarios.nome:null;if(!nome)return;
    HORARIOS[nome]={dias:r.dias,hora:r.hora};
  });

  const{data:paxRows}=await supabaseClient
    .from("pax_esperado").select("*").eq("restaurante_id",RESTAURANTE_ID);
  (paxRows||[]).forEach(r=>{
    if(!PAX[r.dia_semana])PAX[r.dia_semana]={a:0,j:0};
    PAX[r.dia_semana][r.turno==="almoco"?"a":"j"]=r.quantidade;
  });

  const{data:fechadosRows}=await supabaseClient
    .from("dias_fechados").select("*").eq("restaurante_id",RESTAURANTE_ID);
  FJ={};(fechadosRows||[]).forEach(r=>{FJ[r.dia_semana]=r.turno;});

  await carregarHistorico();
  await carregarHistoricoFolgasVendidas();
  await carregarHistoricoFolgasVendidasSemana();
  await carregarOperacional();

  await migrarAgendaLocalStorage();
  await carregarAgenda();
  renderSeletorMes();
  renderCal();renderEmpty();
}

boot();
</script>
